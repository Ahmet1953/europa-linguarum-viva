const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang=(navigator.language||"en").startsWith("de")?"de":"en", tab=1, G=null, clang="de", cur=null;
const GL=[["de","Deutsch"],["es","Español"],["fr","Français"],["it","Italiano"],["tr","Türkçe"],["el","Ελληνικά"]];
const gcache={};
async function gdata(c){return gcache[c]||(gcache[c]=await (await fetch("golden-set/data-"+c+".json")).json());}
function buildBlocks(){
  if(tab===2) return DATA;
  if(!G) return [];
  return Object.keys(G[clang]).map(id=>({id,cats:G[clang][id].map((c,i)=>({n:i+1,name:c.title,key:c.key,st:"final"}))}));
}
function render(l){
  const t=T[l];document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t[e.dataset.i];});
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  document.querySelectorAll(".tab").forEach(b=>{const on=+b.dataset.tab===tab;b.classList.toggle("on",on);b.setAttribute("aria-selected",on);});
  document.getElementById("klangs").innerHTML=tab===1?GL.map(([c,n])=>`<button data-c="${c}" aria-pressed="${c===clang}">${n}</button>`).join(""):"";
  const blocks=buildBlocks();
  if(!blocks.length){document.getElementById("levels").innerHTML='<p class="foot">Loading…</p>';return;}
  const by={};blocks.forEach(b=>(by[b.id.slice(0,2)]??=[]).push(b));
  document.getElementById("levels").innerHTML=Object.keys(by).map((lv,li)=>{
    const nm=LEVELS[lv][l==="en"?0:1];
    const head=li===0?`KLASIK CEFR ${tab}<em>${lv} · ${esc(nm)}</em>`:`${lv}<em>${esc(nm)}</em>`;
    return `<section class="level"><h2>${head}</h2><div class="pair">${by[lv].map(b=>{
      const f=b.cats.filter(c=>c.st==="final").length,r=b.cats.filter(c=>c.st==="review").length,n=b.cats.length;
      if(!n) return `<div class="block soon"><div class="bhead"><span class="bid">${b.id}</span><span class="bmeta">${t.soon}</span></div></div>`;
      const row=c=>`<li class="${c.st}"><span class="n">${c.n}</span>${c.key?`<button class="t cb" data-b="${b.id}" data-k="${esc(c.key)}" data-t="${esc(c.name)}">${esc(c.name)}</button>`:`<span class="t">${esc(c.name)}</span>`}<i class="dot d-${c.st}" title="${t["l"+c.st[0]]}"></i></li>`;
      const body=tab===1?`<ol>${b.cats.map(row).join("")}</ol>`:
      `<div class="grp"><span class="star">★</span> ${t.core}</div><ol>${b.cats.filter(c=>c.core).map(row).join("")}</ol>
      <div class="grp">${t.extra}</div><ol>${b.cats.filter(c=>!c.core).map(row).join("")}</ol>`;
      return `<details class="block" ${b.id<"A2"?"open":""}><summary class="bhead"><span class="bid">${b.id}</span><span class="bmeta">${n} ${t.cats}<br>${f}/${n} ${t.done}</span></summary>
      <div class="bar"><i class="f" style="width:${f/n*100}%"></i><i class="r" style="width:${r/n*100}%"></i></div>${body}</details>`}).join("")}</div></section>`}).join("");
}
async function openCat(){
  const dlg=document.getElementById("dlg"),box=document.getElementById("dbody");
  document.getElementById("dtitle").textContent=cur.t;
  document.getElementById("dsub").textContent=cur.b+" · "+cur.k;
  document.getElementById("dlangs").innerHTML=`<button class="dl" aria-pressed="true" disabled>${(GL.find(x=>x[0]===clang)||[])[1]||clang}</button>`;
  if(!dlg.open) dlg.showModal();
  box.innerHTML='<p class="foot">Loading…</p>';
  let d;try{d=await gdata(clang);}catch(e){box.innerHTML='<p class="foot">Could not load the data.</p>';return;}
  const cat=(d[cur.b]||[]).find(c=>c.key===cur.k);
  const nm=(GL.find(x=>x[0]===clang)||[])[1]||clang,E=s=>esc(String(s??""));
  if(!cat){box.innerHTML='<p class="foot">This category is not part of the '+nm+' set (the '+nm+' set uses a different category list).</p>';return;}
  box.innerHTML=`<table><thead><tr><th>No</th><th>Type</th><th>Key</th><th>Translation (${nm})</th><th>Note</th><th>Example (EN)</th><th>Example (${nm})</th><th>Level</th><th>Freq.</th><th>Tags</th></tr></thead><tbody>`+
   cat.rows.map(r=>`<tr><td class="no">${r.no}</td><td><span class="pill ${E(r.type)}">${E(r.type)}</span></td><td class="k">${E(r.key).replace(/_/g,"_<wbr>")}</td><td class="tr">${E(r.translation)}</td><td>${E(r.tip)}</td><td>${E(r.exampleEN)}</td><td>${E(r.exampleTGT)}</td><td class="nw">${E(r.difficulty)}</td><td class="nw">${E(r.frequency)}</td><td class="tg">${E(r.tags)}</td></tr>`).join("")+`</tbody></table>`;
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>render(lang=b.dataset.l));
document.querySelectorAll(".tab").forEach((b,i)=>{b.dataset.tab=i+1;b.onclick=()=>{if(b.disabled)return;tab=i+1;render(lang);};});
document.getElementById("levels").addEventListener("click",e=>{const b=e.target.closest(".cb");if(!b)return;cur={b:b.dataset.b,k:b.dataset.k,t:b.dataset.t};openCat();});
document.getElementById("klangs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;clang=b.dataset.c;render(lang);});
document.getElementById("dclose").onclick=()=>document.getElementById("dlg").close();
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close();});
render(lang);
fetch("golden-set/index.json").then(r=>r.json()).then(j=>{G=j;render(lang);}).catch(()=>{});
