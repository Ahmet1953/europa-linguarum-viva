<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEFR · Europa Linguarum Viva</title>
<style>/*FONTS*/
:root{--night:#06101f;--ivory:#f3ead8;--mute:#9aa6bf;--gold:#e9b766;--gold-hi:#f5d9a0;--line:rgba(233,183,102,.25);--card:rgba(12,27,56,.55);--teal:#7fc8b8}
html{background:var(--night)}
body{margin:0;color:var(--ivory);font:18px/1.55 "EB Garamond",Georgia,serif;background:radial-gradient(120% 90% at 70% 0,#0c1b38 0,var(--night) 70%) fixed}
main{max-width:1120px;margin:0 auto;padding:40px 16px 80px}
.mono{font-family:"IBM Plex Mono",monospace}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
.top a,.top button{color:var(--gold);text-decoration:none;background:none;border:0;font:inherit;letter-spacing:inherit;cursor:pointer;padding:0}
.top a:hover,.top button:hover{color:var(--gold-hi)}
.top nav{display:flex;gap:14px}.top nav button{color:var(--mute)}.top nav button[aria-pressed=true]{color:var(--gold-hi)}
h1{font-weight:500;font-size:clamp(40px,7vw,68px);line-height:1;margin:48px 0 10px;letter-spacing:.02em}
.lead{max-width:680px;color:#d9cfbb;margin:0 0 28px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tab{font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mute);background:none}
.tab.on{color:var(--night);background:var(--gold);border-color:var(--gold)}
.tab[disabled]{opacity:.55;cursor:not-allowed}
.tab small{font-size:10px;letter-spacing:.08em;text-transform:none;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px 22px;font:400 12.5px/1.4 "IBM Plex Mono",monospace;color:var(--mute);margin:0 0 30px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-final{background:var(--gold)}.d-review{background:transparent;box-shadow:inset 0 0 0 2px var(--teal)}.d-planned{background:rgba(154,166,191,.35)}
.star{color:var(--gold);font-size:13px}
.level{margin:0 0 38px}
.level h2{display:flex;align-items:baseline;gap:14px;font-weight:500;font-size:30px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.level h2 em{font-style:normal;font:400 12px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 10px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
.bhead::-webkit-details-marker{display:none}
.bid{font:500 20px/1 "IBM Plex Mono",monospace;color:var(--gold-hi);letter-spacing:.06em}
.bhead::after{content:"+";font:400 22px/1 "IBM Plex Mono",monospace;color:var(--gold);margin-left:12px;transition:transform .2s}details[open]>.bhead::after{transform:rotate(45deg)}
.bmeta{margin-left:auto;font:400 11.5px/1.3 "IBM Plex Mono",monospace;color:var(--mute);text-align:right}
.bar{height:4px;border-radius:2px;background:rgba(154,166,191,.18);margin:12px 0 4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .f{background:var(--gold)}.bar .r{background:var(--teal)}
ol{list-style:none;margin:10px 0 6px;padding:0}
li{display:grid;grid-template-columns:22px 1fr 16px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid rgba(233,183,102,.09);font-size:16.5px;line-height:1.3}
li .n{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--mute);text-align:right}
li.planned .t{color:#b9b2a3}
li.sep{border-top:1px dashed var(--line);margin-top:4px}
.grp{font:400 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:12px 0 2px}
.foot{color:var(--mute);font-size:15px;border-top:1px solid var(--line);margin-top:40px;padding-top:12px}
.proto{display:inline-block;font:500 10.5px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--night);background:var(--teal);border-radius:4px;padding:4px 6px;vertical-align:middle;margin-left:10px}
@media (max-width:760px){.pair{grid-template-columns:1fr}h1{margin-top:32px}}
</style>
</head>
<body>
<main>
<div class="top"><a href="./">← Europa Linguarum Viva</a><nav><button data-l="en">EN</button><button data-l="de">DE</button></nav></div>
<h1>CEFR<span class="proto" data-i="proto"></span></h1>
<p class="lead" data-i="lead"></p>
<div class="tabs" role="tablist">
  <button class="tab on" role="tab" aria-selected="true" data-i="t1"></button>
  <button class="tab" role="tab" disabled data-i="t2"></button>
  <button class="tab" role="tab" disabled data-i="t3"></button>
</div>
<div class="legend">
  <span><i class="dot d-final"></i><b data-i="lf"></b></span>
  <span><i class="dot d-review"></i><b data-i="lr"></b></span>
  <span><i class="dot d-planned"></i><b data-i="lp"></b></span>
  <span><b class="star">★</b><b data-i="lc"></b></span>
</div>
<div id="levels"></div>
<p class="foot" data-i="foot"></p>
<p class="foot">→ <a href="golden-set.html" style="color:var(--gold-hi)">Golden Set</a> · © 2026 Dr. Ahmet Akan — Alle Rechte vorbehalten / All rights reserved.</p>
</main>
<script>
const DATA=__DATA__, LEVELS=__LEVELS__;
const T={
 en:{proto:"Prototype",lead:"The Common European Framework of Reference organises language learning into six levels. Our German course divides each level into two blocks: 12 blocks, each with its own set of topic categories. The first ten categories of every block are shared by all six course languages; the rest are chosen for each language.",
  t1:"Classic CEFR",t2:"Classic · Modern",t3:"Digital-First",soon:"in preparation",
  lf:"Completed",lr:"In review",lp:"Planned",lc:"Shared core (all six languages)",
  core:"Shared core",extra:"German-specific",cats:"categories",done:"completed",
  foot:"Course language: German. Each category contains 48 entries (22 words, 12 phrases, 14 sentences), each checked by hand and by an independent second review before completion."},
 de:{proto:"Prototyp",lead:"Der Gemeinsame Europäische Referenzrahmen gliedert das Sprachenlernen in sechs Niveaus. Unser Deutschkurs teilt jedes Niveau in zwei Blöcke: 12 Blöcke mit jeweils eigenen Themenkategorien. Die ersten zehn Kategorien jedes Blocks sind in allen sechs Kurssprachen gleich, die übrigen werden je Sprache gewählt.",
  t1:"Klassischer GER",t2:"Klassisch · Modern",t3:"Digital-First",soon:"in Vorbereitung",
  lf:"Abgeschlossen",lr:"In Prüfung",lp:"Geplant",lc:"Gemeinsamer Kern (alle sechs Sprachen)",
  core:"Gemeinsamer Kern",extra:"Deutsch-spezifisch",cats:"Kategorien",done:"abgeschlossen",
  foot:"Kurssprache: Deutsch. Jede Kategorie umfasst 48 Einträge (22 Wörter, 12 Wendungen, 14 Sätze), die vor dem Abschluss von Hand und durch eine unabhängige Zweitprüfung kontrolliert werden."}
};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(l){
  const t=T[l];document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{const k=e.dataset.i;e.textContent=t[k];
    if(e.disabled){const s=document.createElement("small");s.textContent="· "+t.soon;e.appendChild(s);}});
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  const by={};DATA.forEach(b=>(by[b.id.slice(0,2)]??=[]).push(b));
  document.getElementById("levels").innerHTML=Object.keys(by).map(lv=>{
    const nm=LEVELS[lv][l==="en"?0:1];
    return `<section class="level"><h2>${lv}<em>${esc(nm)}</em></h2><div class="pair">${by[lv].map(b=>{
      const f=b.cats.filter(c=>c.st==="final").length,r=b.cats.filter(c=>c.st==="review").length,n=b.cats.length;
      const row=c=>`<li class="${c.st}"><span class="n">${c.n}</span><span class="t">${esc(c.name)}</span><i class="dot d-${c.st}" title="${t["l"+c.st[0]]}"></i></li>`;
      return `<details class="block" ${b.id<"A2"?"open":""}><summary class="bhead"><span class="bid">${b.id}</span><span class="bmeta">${n} ${t.cats}<br>${f}/${n} ${t.done}</span></summary>
      <div class="bar"><i class="f" style="width:${f/n*100}%"></i><i class="r" style="width:${r/n*100}%"></i></div>
      <div class="grp"><span class="star">★</span> ${t.core}</div><ol>${b.cats.filter(c=>c.core).map(row).join("")}</ol>
      <div class="grp">${t.extra}</div><ol>${b.cats.filter(c=>!c.core).map(row).join("")}</ol></details>`}).join("")}</div></section>`}).join("");
}
let lang=(navigator.language||"en").startsWith("de")?"de":"en";
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>render(lang=b.dataset.l));
render(lang);
</script>
</body>
</html>
